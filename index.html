<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arosha Silva | Portfolio</title>
    <style>
        /* ===== Reset & Base ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            color: #e8e8f0;
            overflow-x: hidden;
            position: relative;
        }

        /* ===== Animated Gradient Background ===== */
        /* ===== Animated Gradient Background ===== */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -2;
            background: linear-gradient(
                -45deg,
                #0f0c29,
                rgb(22, 209, 222),
                #1a1a4e,
                rgb(222, 22, 119),
                #0d3b66,
                rgb(30, 186, 40),
                #2b1055,
                #1a1a4e
            );
            background-size: 500% 500%;
            animation: gradientShift 25s ease infinite;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(circle at 20% 30%, rgba(22, 209, 222, 0.10), transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(222, 22, 119, 0.10), transparent 40%),
                radial-gradient(circle at 50% 90%, rgba(30, 186, 40, 0.08), transparent 45%);
            animation: orbFloat 15s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes gradientShift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes orbFloat {
            0%   { transform: translate(0, 0) scale(1); opacity: 0.6; }
            100% { transform: translate(-30px, 30px) scale(1.2); opacity: 1; }
        }

        /* ===== Layout ===== */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 4rem 1.5rem;
        }

        /* ===== Header with Avatar + Neon Title ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 0.5rem;
            flex-wrap: wrap;
        }

        .header img.avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid rgba(0, 255, 255, 0.6);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            object-fit: cover;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .header img.avatar:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.8);
        }

        h1 {
            font-size: clamp(2.2rem, 6vw, 3.8rem);
            font-weight: 700;
            letter-spacing: 2px;
            color: #fff;
            text-shadow:
                0 0 7px #fff,
                0 0 10px #fff,
                0 0 21px #0ff,
                0 0 42px #0ff,
                0 0 82px #0ff,
                0 0 92px #0ff;
            animation: neonPulse 2.5s ease-in-out infinite alternate;
        }

        @keyframes neonPulse {
            0%   { text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 15px #0ff, 0 0 30px #0ff, 0 0 60px #0ff; }
            100% { text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #0ff, 0 0 60px #0ff, 0 0 100px #0ff; }
        }

        .subtitle {
            text-align: center;
            font-size: 1.1rem;
            color: #a0a0c0;
            margin-bottom: 3rem;
            letter-spacing: 1px;
        }

        /* ===== Section Heading ===== */
        h2 {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.6);
            letter-spacing: 1px;
            margin-top: 2.5rem;
        }

        /* ===== Project Cards ===== */
        .repo-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.2rem;
        }

        .repo-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1.5rem 1.8rem;
            text-decoration: none;
            color: inherit;
            display: block;
            position: relative;
            overflow: hidden;
            transition: all 0.35s ease;
        }

        .repo-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 16px;
            padding: 1px;
            background: linear-gradient(135deg, #0ff, #f0f, #0ff);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        .repo-card:hover {
            transform: translateY(-5px) scale(1.01);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 40px rgba(0, 255, 255, 0.2);
        }

        .repo-card:hover::before { opacity: 1; }

        .repo-card h3 {
            font-size: 1.2rem;
            font-weight: 600;
            color: #0ff;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.5);
            letter-spacing: 0.5px;
        }

        .repo-card p {
            color: #b8b8d0;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 0.8rem;
        }

        .repo-card .meta {
            font-size: 0.85rem;
            color: #8888aa;
            display: flex;
            gap: 1.2rem;
        }

        .repo-card .meta span { display: inline-flex; align-items: center; gap: 0.3rem; }

        /* Active/featured card gets a permanent subtle glow */
        #featured-list .repo-card {
            border-color: rgba(0, 255, 255, 0.4);
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.15);
        }

        /* ===== Figma / UI-UX Card ===== */
        .figma-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1.5rem 1.8rem;
            position: relative;
            overflow: hidden;
            transition: all 0.35s ease;
        }

        .figma-card:hover {
            transform: translateY(-5px) scale(1.01);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 40px rgba(162, 89, 255, 0.25);
        }

        .figma-card h3 {
            font-size: 1.2rem;
            font-weight: 600;
            color: #a259ff;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 8px rgba(162, 89, 255, 0.6);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .figma-card h3 svg { flex-shrink: 0; }

        .figma-card p {
            color: #b8b8d0;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 0.8rem;
        }

        .figma-card .meta {
            font-size: 0.85rem;
            color: #8888aa;
            display: flex;
            gap: 1.2rem;
            flex-wrap: wrap;
        }

        .figma-embed-wrap {
            margin-top: 1rem;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(162, 89, 255, 0.25);
            display: none;
        }

        .figma-card.expanded .figma-embed-wrap { display: block; }

        .figma-embed-wrap iframe {
            width: 100%;
            height: 450px;
            border: none;
            display: block;
            background: #1e1e1e;
        }

        .figma-toggle {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            margin-top: 0.6rem;
            font-size: 0.85rem;
            color: #a259ff;
            cursor: pointer;
            background: none;
            border: none;
            font-family: inherit;
            padding: 0;
            transition: color 0.3s ease;
        }

        .figma-toggle:hover { color: #c084fc; }

        .figma-toggle::after {
            content: '▾';
            transition: transform 0.3s ease;
        }

        .figma-card.expanded .figma-toggle::after { transform: rotate(180deg); }

        .figma-link {
            color: #a259ff;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .figma-link:hover { color: #c084fc; }

        /* ===== Contacts ===== */
        .contacts {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            margin-bottom: 2rem;
            transition: box-shadow 0.35s ease;
        }

        .contacts:hover {
            box-shadow: 0 8px 30px rgba(0, 255, 255, 0.15);
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            color: #a0a0c0;
            text-decoration: none;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            transition: color 0.3s ease, transform 0.3s ease, filter 0.3s ease;
        }

        .contact-item:hover {
            color: #0ff;
            transform: translateY(-2px);
            filter: drop-shadow(0 0 8px rgba(0, 255, 255, 0.8));
        }

        .contact-item svg { transition: transform 0.3s ease; }
        .contact-item:hover svg { transform: scale(1.1); }

        .divider {
            color: rgba(255, 255, 255, 0.2);
            font-size: 1.4rem;
            font-weight: 300;
        }

        /* ===== Loading placeholder ===== */
        .loading { color: #8888aa; font-style: italic; }

        /* ===== Footer ===== */
        footer {
            text-align: center;
            margin-top: 4rem;
            color: #6666aa;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }
    </style>
</head>

    <script>
        // ===== Configuration =====
        const GITHUB_USERNAME = 'AroshaSilva';

        const FEATURED_REPOS = [
            'SideLoad_-_APK_Installer-v1.0-'
        ];

        const ACADEMIC_REPOS = [
            'Palace_of_Laptops',
            'Billing-Simulator'
        ];

        const ALL_REPOS = [...new Set([...FEATURED_REPOS, ...ACADEMIC_REPOS])];

        const DISPLAY_NAMES = {
            'SideLoad_-_APK_Installer-v1.0-': 'SideLoad — APK Installer',
            'Palace_of_Laptops': 'Palace of Laptops',
            'Billing-Simulator': 'Billing Simulator'
        };

        // ===== UI/UX Designs (Figma) =====
        // No public Figma metadata API → hardcoded. Add new entries here.
        const FIGMA_PROJECTS = [
            {
                title: 'EduMart',
                description: 'E-commerce UI/UX design for an educational marketplace — homepage, product detail pages, and a complete design system.',
                url: 'https://www.figma.com/community/file/1668505195173173916',
                embedUrl: 'https://www.figma.com/embed?embed_host=share&url=https://www.figma.com/community/file/1668505195173173916',
                meta: 'UI Design • E-commerce • Design System'
            }
        ];

        const CACHE_KEY = 'aroshaportfolio_cache_v4';
        const CACHE_DURATION = 60 * 60 * 1000; // 1 hour

        // ===== Data Fetching =====
        async function fetchGitHubData() {
            const cached = localStorage.getItem(CACHE_KEY);
            if (cached) {
                try {
                    const { timestamp, repos } = JSON.parse(cached);
                    if (Date.now() - timestamp < CACHE_DURATION) {
                        render(repos);
                        return;
                    }
                } catch (e) { /* ignore bad cache */ }
            }

            try {
                const repoResponses = await Promise.all(
                    ALL_REPOS.map(name =>
                        fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${name}`)
                    )
                );

                const repos = await Promise.all(repoResponses.map(r => r.json()));
                const validRepos = repos.filter(r => !r.message);

                localStorage.setItem(CACHE_KEY, JSON.stringify({
                    timestamp: Date.now(),
                    repos: validRepos
                }));

                render(validRepos);
            } catch (error) {
                console.error('Failed to fetch GitHub data:', error);
                document.getElementById('featured-list').innerHTML = '<p class="loading">Could not load projects.</p>';
                document.getElementById('academic-list').innerHTML = '<p class="loading">Could not load projects.</p>';
            }
        }

        // ===== Helpers =====
        function buildCard(repo) {
            const displayName = DISPLAY_NAMES[repo.name] || repo.name;
            return `
                <a class="repo-card" href="${repo.html_url}" target="_blank" rel="noopener">
                    <h3>${displayName}</h3>
                    <p>${repo.description || 'No description provided yet.'}</p>
                    <div class="meta">
                        <span>⭐ ${repo.stargazers_count}</span>
                        <span>🍴 ${repo.forks_count}</span>
                        <span>💻 ${repo.language || 'N/A'}</span>
                    </div>
                </a>
            `;
        }

        function renderGroup(elementId, repoList, fetchedRepos) {
            const el = document.getElementById(elementId);
            if (!el) return;
            const ordered = repoList
                .map(name => fetchedRepos.find(r => r.name === name))
                .filter(Boolean);

            if (ordered.length === 0) {
                el.innerHTML = '<p class="loading">No projects could be loaded.</p>';
                return;
            }
            el.innerHTML = ordered.map(buildCard).join('');
            el.classList.remove('loading');
        }

        // Figma card with live expandable embed
        function buildFigmaCard(project, index) {
            const figmaLogo = `
                <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                    <path fill="#f24e1e" d="M8 24a4 4 0 0 0 4-4v-4H8a4 4 0 1 0 0 8z"/>
                    <path fill="#ff7262" d="M16 24a4 4 0 0 0 4-4v-4h-4v8z"/>
                    <path fill="#a259ff" d="M12 8H8a4 4 0 1 0 0 8h4V8z"/>
                    <path fill="#1abcfe" d="M20 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/>
                    <path fill="#0acf83" d="M16 0H8a4 4 0 0 0 0 8h8V0z"/>
                </svg>
            `;
            return `
                <div class="figma-card" data-index="${index}">
                    <h3>${figmaLogo} ${project.title}</h3>
                    <p>${project.description}</p>
                    <div class="meta">
                        <span>🎨 ${project.meta}</span>
                    </div>
                    <button class="figma-toggle" data-index="${index}">Preview design</button>
                    <div class="figma-embed-wrap" id="figma-embed-${index}"></div>
                    <div class="meta" style="margin-top:0.8rem;">
                        <a class="figma-link" href="${project.url}" target="_blank" rel="noopener">View on Figma →</a>
                    </div>
                </div>
            `;
        }

        function renderFigmaProjects() {
            const el = document.getElementById('figma-list');
            if (!el) return;
            if (FIGMA_PROJECTS.length === 0) {
                el.innerHTML = '<p class="loading">No designs added yet.</p>';
                return;
            }
            el.innerHTML = FIGMA_PROJECTS.map(buildFigmaCard).join('');
            el.classList.remove('loading');

            el.querySelectorAll('.figma-toggle').forEach(btn => {
                btn.addEventListener('click', () => {
                    const index = btn.dataset.index;
                    const card = btn.closest('.figma-card');
                    const wrap = document.getElementById(`figma-embed-${index}`);
                    const project = FIGMA_PROJECTS[index];

                    const isExpanded = card.classList.toggle('expanded');

                    if (isExpanded && !wrap.dataset.loaded) {
                        const iframe = document.createElement('iframe');
                        iframe.src = project.embedUrl;
                        iframe.loading = 'lazy';
                        iframe.allowFullscreen = true;
                        iframe.title = `${project.title} Figma preview`;
                        wrap.appendChild(iframe);
                        wrap.dataset.loaded = 'true';
                    }
                });
            });
        }

        // ===== Rendering =====
        function render(repos) {
            const avatar = document.getElementById('avatar');
            if (!avatar.src || avatar.src === window.location.href) {
                avatar.src = `https://github.com/${GITHUB_USERNAME}.png`;
            }

            renderGroup('featured-list', FEATURED_REPOS, repos);
            renderGroup('academic-list', ACADEMIC_REPOS, repos);
            renderFigmaProjects();
        }

        // ===== Init =====
        document.getElementById('year').textContent = new Date().getFullYear();

        // Render UI/UX section immediately (no API needed)
        renderFigmaProjects();

        // Fetch GitHub data
        fetchGitHubData();
    </script>
