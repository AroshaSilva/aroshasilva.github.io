<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        .repo-card { border: 1px solid #ddd; padding: 1rem; margin-bottom: 1rem; border-radius: 8px; }
        .stats { background: #f4f4f4; padding: 1rem; border-radius: 8px; margin-bottom: 2rem; }
    </style>
</head>
<body>
    <h1>Hi, I'm [Arosha Silva], also known as Gamerlaza_</h1>
    <div id="github-stats" class="stats">Loading GitHub stats...</div>
    <h2>My Projects</h2>
    <div id="repo-list">Loading repositories...</div>

    <script>
        // ===== Configuration =====
        const GITHUB_USERNAME = 'AroshaSilva'; // Change to your GitHub username
        const CACHE_KEY = 'github_portfolio_cache';
        const CACHE_DURATION = 60 * 60 * 1000; // 1 hour cache (in milliseconds)

        // ===== Core Logic =====
        async function fetchGitHubData() {
            // 1. Check cache first to avoid frequent API calls
            const cached = localStorage.getItem(CACHE_KEY);
            if (cached) {
                const { timestamp, user, repos } = JSON.parse(cached);
                if (Date.now() - timestamp < CACHE_DURATION) {
                    console.log('Using cached data');
                    render(user, repos);
                    return;
                }
            }

            // 2. Fetch data if no cache (calling GitHub public API)
            try {
                const [userRes, reposRes] = await Promise.all([
                    fetch(`https://api.github.com/users/${GITHUB_USERNAME}`),
                    fetch(`https://api.github.com/users/${GITHUB_USERNAME}/repos?sort=updated&per_page=10`)
                ]);
                
                const user = await userRes.json();
                const repos = await reposRes.json();

                // 3. Write to cache (valid for 1 hour)
                localStorage.setItem(CACHE_KEY, JSON.stringify({
                    timestamp: Date.now(),
                    user,
                    repos
                }));

                render(user, repos);
            } catch (error) {
                console.error('Failed to fetch GitHub data:', error);
                document.getElementById('github-stats').innerHTML = 'Failed to load GitHub data. Please try again later.';
            }
        }

        // ===== Render to Page =====
        function render(user, repos) {
            // Render basic stats
            document.getElementById('github-stats').innerHTML = `
                <img src="${user.avatar_url}" width="60" style="border-radius:50%; vertical-align:middle; margin-right:15px;">
                <strong>${user.name || user.login}</strong><br>
                Repositories: ${user.public_repos} | Followers: ${user.followers}
            `;

            // Render repository list (sorted by stars in descending order, or by update time)
            const repoList = document.getElementById('repo-list');
            if (!Array.isArray(repos) || repos.length === 0) {
                repoList.innerHTML = '<p>No public repositories found.</p>';
                return;
            }

            // Simple sorting by stars in descending order (remove .sort to keep default order)
            const sortedRepos = repos.sort((a, b) => b.stargazers_count - a.stargazers_count).slice(0, 6); // Show only top 6

            repoList.innerHTML = sortedRepos.map(repo => `
                <div class="repo-card">
                    <h3><a href="${repo.html_url}" target="_blank">${repo.name}</a></h3>
                    <p>${repo.description || 'No description'}</p>
                    <small>⭐ ${repo.stargazers_count} | Language: ${repo.language || 'N/A'}</small>
                </div>
            `).join('');
        }

        // Start execution
        fetchGitHubData();
    </script>
</body>
</html>
