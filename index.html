<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arosha Silva | Portfolio</title>
    <style>
        /* ===== Reset & Base ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            color: #e8e8f0;
            overflow-x: hidden;
            position: relative;
        }

        /* ===== Animated Gradient Background ===== */
        /* This creates a background that smoothly shifts colors over time */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -2;
            background: linear-gradient(
                -45deg,
                #0f0c29,
                #1a1a4e,
                #2b1055,
                #0d3b66,
                #1a1a4e
            );
            background-size: 400% 400%;
            animation: gradientShift 20s ease infinite;
        }

        /* Subtle moving glow orbs on top of the gradient */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 255, 255, 0.08), transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255, 0, 255, 0.08), transparent 40%);
            animation: orbFloat 15s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes gradientShift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes orbFloat {
            0%   { transform: translate(0, 0) scale(1); opacity: 0.6; }
            100% { transform: translate(-30px, 30px) scale(1.2); opacity: 1; }
        }

        /* ===== Layout ===== */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 4rem 1.5rem;
        }

        /* ===== Neon Title ===== */
        h1 {
            font-size: clamp(2.2rem, 6vw, 3.8rem);
            font-weight: 700;
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 0.5rem;
            color: #fff;
            text-shadow:
                0 0 7px #fff,
                0 0 10px #fff,
                0 0 21px #0ff,
                0 0 42px #0ff,
                0 0 82px #0ff,
                0 0 92px #0ff;
            animation: neonPulse 2.5s ease-in-out infinite alternate;
        }

        @keyframes neonPulse {
            0%   { text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 15px #0ff, 0 0 30px #0ff, 0 0 60px #0ff; }
            100% { text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #0ff, 0 0 60px #0ff, 0 0 100px #0ff; }
        }

        .subtitle {
            text-align: center;
            font-size: 1.1rem;
            color: #a0a0c0;
            margin-bottom: 3rem;
            letter-spacing: 1px;
        }

        /* ===== Glass Stats Card ===== */
        .stats {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 1.8rem 2rem;
            margin-bottom: 3rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stats:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 255, 255, 0.15);
        }

        .stats img {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 2px solid rgba(0, 255, 255, 0.6);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
        }

        .stats-info { flex: 1; }
        .stats-info .name { font-size: 1.4rem; font-weight: 600; color: #fff; }
        .stats-info .counts { margin-top: 0.4rem; color: #b0b0d0; font-size: 0.95rem; }

        /* ===== Section Heading ===== */
        h2 {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.6);
            letter-spacing: 1px;
        }

        /* ===== Project Cards ===== */
        .repo-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.2rem;
        }

        .repo-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1.5rem 1.8rem;
            text-decoration: none;
            color: inherit;
            display: block;
            position: relative;
            overflow: hidden;
            transition: all 0.35s ease;
        }

        /* Neon border glow on hover */
        .repo-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 16px;
            padding: 1px;
            background: linear-gradient(135deg, #0ff, #f0f, #0ff);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        .repo-card:hover {
            transform: translateY(-5px) scale(1.01);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 40px rgba(0, 255, 255, 0.2);
        }

        .repo-card:hover::before { opacity: 1; }

        .repo-card h3 {
            font-size: 1.2rem;
            font-weight: 600;
            color: #0ff;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.5);
            letter-spacing: 0.5px;
        }

        .repo-card p {
            color: #b8b8d0;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 0.8rem;
        }

        .repo-card .meta {
            font-size: 0.85rem;
            color: #8888aa;
            display: flex;
            gap: 1.2rem;
        }

        .repo-card .meta span { display: inline-flex; align-items: center; gap: 0.3rem; }

        /* ===== Loading placeholder ===== */
        .loading { color: #8888aa; font-style: italic; }

        /* ===== Footer ===== */
        footer {
            text-align: center;
            margin-top: 4rem;
            color: #6666aa;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Arosha Silva</h1>
        <p class="subtitle">Developer &nbsp;•&nbsp; Builder &nbsp;•&nbsp; Problem Solver</p>

        <div id="github-stats" class="stats loading">Loading GitHub profile...</div>

        <h2>Featured Projects</h2>
        <div id="repo-list" class="repo-list loading">Loading projects...</div>

        <footer>© <span id="year"></span> Arosha Silva</footer>
    </div>

    <script>
        // ===== Configuration =====
        const GITHUB_USERNAME = 'AroshaSilva';
        // Only these three repos will be shown, in this exact order
        const FEATURED_REPOS = [
            'SideLoad_-_APK_Installer-v1.0-',
            'Palace_of_Laptops',
            'Billing-Simulator'
        ];
        // Nice display names (since repo names are technical)
        const DISPLAY_NAMES = {
            'SideLoad_-_APK_Installer-v1.0-': 'SideLoad — APK Installer',
            'Palace_of_Laptops': 'Palace of Laptops',
            'Billing-Simulator': 'Billing Simulator'
        };

        const CACHE_KEY = 'aroshaportfolio_cache_v1';
        const CACHE_DURATION = 60 * 60 * 1000; // 1 hour

        // ===== Data Fetching =====
        async function fetchGitHubData() {
            // Try cache first
            const cached = localStorage.getItem(CACHE_KEY);
            if (cached) {
                try {
                    const { timestamp, user, repos } = JSON.parse(cached);
                    if (Date.now() - timestamp < CACHE_DURATION) {
                        render(user, repos);
                        return;
                    }
                } catch (e) { /* ignore bad cache */ }
            }

            try {
                // Fetch user profile + only the featured repos in parallel
                const [userRes, ...repoResponses] = await Promise.all([
                    fetch(`https://api.github.com/users/${GITHUB_USERNAME}`),
                    ...FEATURED_REPOS.map(name =>
                        fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${name}`)
                    )
                ]);

                const user = await userRes.json();
                const repos = await Promise.all(repoResponses.map(r => r.json()));

                // If any repo returned 404 (name typo / renamed), filter it out gracefully
                const validRepos = repos.filter(r => !r.message);

                // Save to cache
                localStorage.setItem(CACHE_KEY, JSON.stringify({
                    timestamp: Date.now(),
                    user,
                    repos: validRepos
                }));

                render(user, validRepos);
            } catch (error) {
                console.error('Failed to fetch GitHub data:', error);
                document.getElementById('github-stats').innerHTML = 'Could not load GitHub data. Please try again later.';
                document.getElementById('repo-list').innerHTML = '';
            }
        }

        // ===== Rendering =====
        function render(user, repos) {
            // Profile stats
            document.getElementById('github-stats').innerHTML = `
                <img src="${user.avatar_url}" alt="${user.login} avatar">
                <div class="stats-info">
                    <div class="name">${user.name || user.login}</div>
                    <div class="counts">
                        ${user.public_repos} repositories &nbsp;•&nbsp; ${user.followers} followers
                    </div>
                </div>
            `;
            document.getElementById('github-stats').classList.remove('loading');

            // Project cards — keep the original FEATURED_REPOS order
            const repoList = document.getElementById('repo-list');
            const ordered = FEATURED_REPOS
                .map(name => repos.find(r => r.name === name))
                .filter(Boolean); // drop any that failed to load

            if (ordered.length === 0) {
                repoList.innerHTML = '<p class="loading">No projects could be loaded.</p>';
                return;
            }

            repoList.innerHTML = ordered.map(repo => {
                const displayName = DISPLAY_NAMES[repo.name] || repo.name;
                return `
                    <a class="repo-card" href="${repo.html_url}" target="_blank" rel="noopener">
                        <h3>${displayName}</h3>
                        <p>${repo.description || 'No description provided yet.'}</p>
                        <div class="meta">
                            <span>⭐ ${repo.stargazers_count}</span>
                            <span>🍴 ${repo.forks_count}</span>
                            <span>💻 ${repo.language || 'N/A'}</span>
                        </div>
                    </a>
                `;
            }).join('');
            repoList.classList.remove('loading');
        }

        // ===== Init =====
        document.getElementById('year').textContent = new Date().getFullYear();
        fetchGitHubData();
    </script>
</body>
</html>
